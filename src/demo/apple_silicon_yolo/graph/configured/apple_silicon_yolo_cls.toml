[driver]
dir = [
    "/usr/local/share/modelbox/demo/apple_silicon_yolo/flowunit"
]
[flow]
desc = "YOLO-cls on Apple Silicon via Core ML (CPU + GPU + ANE)"
[graph]
format = "graphviz"
graphconf = """digraph apple_silicon_yolo_cls {
    node [shape=Mrecord]
    video_input[type=flowunit, flowunit=video_input, device=cpu, deviceid=0, source_url="/opt/modelbox/demo/video/yolo26n_test_video.mp4"]
    videodemuxer[type=flowunit, flowunit=video_demuxer, device=cpu, deviceid=0]
    videodecoder[type=flowunit, flowunit=video_decoder, device=cpu, deviceid=0, pix_fmt=bgr]
    image_resize[type=flowunit, flowunit=resize, device=cpu, deviceid=0, image_width=224, image_height=224]
    image_transpose[type=flowunit, flowunit=packed_planar_transpose, device=cpu, deviceid=0]
    normalize[type=flowunit, flowunit=normalize, device=cpu, deviceid=0, standard_deviation_inverse="0.00392156862745098,0.00392156862745098,0.00392156862745098"]
    yolo_detect[type=flowunit, flowunit=yolo_cls_detect, device=apple_silicon, deviceid=0, batch_size=1]
    yolo_post[type=flowunit, flowunit=yolo_cls_post, device=cpu, deviceid=0, top_k=5, num_classes=1000]
    videoencoder[type=flowunit, flowunit=video_encoder, device=cpu, deviceid=0, encoder=h264_videotoolbox, format=mp4, default_dest_url="/tmp/apple_silicon_yolo_cls_result.mp4"]

    video_input:out_video_url -> videodemuxer:in_video_url
    videodemuxer:out_video_packet -> videodecoder:in_video_packet
    videodecoder:out_video_frame -> image_resize:in_image
    image_resize:out_image -> image_transpose:in_image
    image_transpose:out_image -> normalize:in_data
    normalize:out_data -> yolo_detect:input
    yolo_detect:output -> yolo_post:in_feat
    videodecoder:out_video_frame -> yolo_post:in_image
    yolo_post:out_data -> videoencoder:in_video_frame
}"""
