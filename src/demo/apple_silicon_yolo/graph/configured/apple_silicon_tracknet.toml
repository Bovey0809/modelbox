[driver]
dir = [
    "/usr/local/share/modelbox/demo/apple_silicon_yolo/flowunit"
]
[flow]
desc = "TrackNet shuttlecock tracking on Apple Silicon via Core ML (3-frame stack, heatmap post)"
[graph]
format = "graphviz"
graphconf = """digraph apple_silicon_tracknet {
    node [shape=Mrecord]
    video_input[type=flowunit, flowunit=video_input, device=cpu, deviceid=0, source_url="/opt/modelbox/demo/video/yolo26n_test_video.mp4"]
    videodemuxer[type=flowunit, flowunit=video_demuxer, device=cpu, deviceid=0]
    videodecoder[type=flowunit, flowunit=video_decoder, device=cpu, deviceid=0, pix_fmt=bgr]
    image_resize[type=flowunit, flowunit=resize, device=cpu, deviceid=0, image_width=512, image_height=288]
    normalize[type=flowunit, flowunit=normalize, device=cpu, deviceid=0, standard_deviation_inverse="0.00392157,0.00392157,0.00392157"]
    stacker[type=flowunit, flowunit=tracknet_frame_stacker, device=cpu, deviceid=0]
    tracknet_infer[type=flowunit, flowunit=tracknet_deep, device=apple_silicon, deviceid=0, batch_size=1]
    tracknet_post[type=flowunit, flowunit=tracknet_post, device=cpu, deviceid=0, score_thr=0.3]
    videoencoder[type=flowunit, flowunit=video_encoder, device=cpu, deviceid=0, encoder=h264_videotoolbox, format=mp4, default_dest_url="/tmp/apple_silicon_tracknet_result.mp4"]

    video_input:out_video_url    -> videodemuxer:in_video_url
    videodemuxer:out_video_packet -> videodecoder:in_video_packet
    videodecoder:out_video_frame -> image_resize:in_image
    image_resize:out_image       -> normalize:in_data
    normalize:out_data           -> stacker:frame
    stacker:stacked              -> tracknet_infer:frames
    tracknet_infer:heatmaps      -> tracknet_post:heatmaps
    videodecoder:out_video_frame -> tracknet_post:source_frame
    tracknet_post:frame_out      -> videoencoder:in_video_frame
}"""
