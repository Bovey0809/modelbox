[base]
name = "tracknet_deep"
device = "apple_silicon"
version = "1.0.0"
description = "TrackNetDeep ball-tracking inference on Apple Silicon via Core ML (CPU + GPU + ANE)"
entry = "./tracknet_deep.mlpackage"
type = "inference"
virtual_type = "coreml"

[input]
[input.input1]
name = "frames"
type = "float"

[output]
[output.output1]
name = "heatmaps"
type = "float"
