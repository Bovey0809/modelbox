#
# Reusable inference flowunit wrapping sutrack_b224.onnx via the new ModelBox
# ONNX Runtime engine driver. Wire into a custom tracker-driver graph that
# supplies (template, search, template_anno) and decodes the four outputs.
#
[base]
name = "sutrack_infer_ort"
device = "cpu"
version = "1.0.0"
description = "SUTrack b224 (multi-modal, no-text) inference via ModelBox's ONNX Runtime driver."
entry = "./sutrack_b224.onnx"
type = "inference"
virtual_type = "onnxruntime"

[input]
[input.input1]
name = "template"
type = "float"

[input.input2]
name = "search"
type = "float"

[input.input3]
name = "template_anno"
type = "float"

[output]
[output.output1]
name = "score_map"
type = "float"

[output.output2]
name = "size_map"
type = "float"

[output.output3]
name = "offset_map"
type = "float"

[output.output4]
name = "pred_boxes"
type = "float"
