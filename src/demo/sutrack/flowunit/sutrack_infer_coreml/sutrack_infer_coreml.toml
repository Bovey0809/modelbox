#
# Reusable inference flowunit wrapping sutrack_b224.mlpackage via ModelBox's
# Apple Silicon Core ML engine (CPU + GPU + ANE).
#
[base]
name = "sutrack_infer_coreml"
device = "apple_silicon"
version = "1.0.0"
description = "SUTrack b224 (multi-modal, no-text) inference on Apple Silicon via Core ML."
entry = "./sutrack_b224.mlpackage"
type = "inference"
virtual_type = "coreml"

[input]
[input.input1]
name = "template"
type = "float"

[input.input2]
name = "search"
type = "float"

[input.input3]
name = "template_anno"
type = "float"

[output]
[output.output1]
name = "score_map"
type = "float"

[output.output2]
name = "size_map"
type = "float"

[output.output3]
name = "offset_map"
type = "float"

[output.output4]
name = "pred_boxes"
type = "float"
