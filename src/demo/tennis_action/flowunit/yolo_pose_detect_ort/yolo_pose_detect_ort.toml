[base]
name = "yolo_pose_detect"
device = "cpu"
version = "1.0.0"
description = "YOLOv8-pose inference on CPU via ONNX Runtime (stub-capable, used by the cpu_stub graph variant)."
entry = "./yolov8n-pose.onnx"
type = "inference"
virtual_type = "onnxruntime"

[input]
[input.input1]
name = "input"
type = "float"

[output]
[output.output1]
name = "output"
type = "float"
