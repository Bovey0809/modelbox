[base]
name = "poses_history_collector"
device = "cpu"
version = "1.0.0"
description = "Collect per-frame tracked_poses JSON buffers into a single collapsed JSON dict {frame_idx_str: [{track_id, bbox, kpts, score}, ...]} emitted at session end."
entry = "poses_history_collector@PosesHistoryCollector"
type = "python"

collapse = true

[input]
[input.input1]
name = "tracked_poses"

[output]
[output.output1]
name = "poses_history"
