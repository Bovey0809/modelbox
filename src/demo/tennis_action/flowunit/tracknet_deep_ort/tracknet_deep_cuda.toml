[base]
name = "tracknet_deep"
device = "cuda"
version = "1.0.0"
description = "TrackNet ball heatmap inference on CUDA via ONNX Runtime."
entry = "./tracknet_deep.onnx"
type = "inference"
virtual_type = "onnxruntime"

[input]
[input.input1]
name = "frames"
type = "float"

[output]
[output.output1]
name = "heatmaps"
type = "float"
