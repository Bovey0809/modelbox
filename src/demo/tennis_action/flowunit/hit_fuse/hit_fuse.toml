[base]
name = "hit_fuse"
device = "cpu"
version = "1.0.0"
description = "Cross-confirm hit audio + ball trajectory; assign hitter; assemble T-frame keypoint window per confirmed hit."
entry = "hit_fuse@HitFuse"
type = "python"

# Input cardinality is already 1 buffer (hit_centers_emit is collapse=true), so
# hit_fuse just needs expand=true to push N output buffers per process() call.
# A previous version had collapse=true here too, which caused ModelBox to set up
# a data context but never invoke process() / data_post() — the
# collapse-after-collapse combination wedged the scheduler.
expand = true

[config]
T = 32
require_visual_confirm = true
# min_window_coverage: fraction of T frames that must have a valid pose
# (including boundary forward-fill) for assemble_window to emit a
# window. The default 0.75 dropped most hits on phone clips because
# pose recall is sparse; 0.40 still rejects truly empty windows while
# letting hits with ~13 valid poses out of 32 frames through.
min_window_coverage = 0.40
image_width = 1280
image_height = 720
asformer_meta_path = ""

[input]
[input.input1]
name = "hit_centers"
# ball_history and poses_history are produced by the two history-collector
# flowunits (ORIGIN+STREAM, accumulate in process() and emit one JSON
# buffer in data_post()), so each delivers exactly one buffer/session.
# Their data_post emit reaches downstream via the engine's
# MergeDataPostOutput second-pass (committed earlier in this branch).
# Wiring them as direct inputs (replacing the previous _tennis_store
# side-channel for ball/pose) makes ModelBox block hit_fuse until the
# video branch has finished, fixing the audio-vs-video race where
# hit_fuse was firing on ~25 % video coverage.
[input.input2]
name = "ball_history"
[input.input3]
name = "poses_history"

[output]
[output.output1]
name = "hit_window"
[output.output2]
name = "hit_meta"
[output.output3]
name = "mask"
# dropped_hits is no longer a direct output port — hit_fuse writes the
# per-session dropped list to the shared _tennis_store side-channel and
# action_sink reads it in data_post. ModelBox cannot match a 1-buffer/session
# output against the N-buffers/session hit_meta + asformer logits at a single
# downstream node.
