[base]
name = "hit_window_emitter"
device = "cpu"
version = "1.0.0"
description = "Decode audio from a video and emit one mel-spectrogram buffer per sliding window for the hit_sound classifier."
entry = "hit_window_emitter@HitWindowEmitter"
type = "python"

# expand: one upstream trigger buffer is expanded into N per-window mel tensors.
expand = true

[config]
# Path to the video to score. Read at open() time from the graph TOML.
video_path = "/Users/houbowei/Desktop/tennis/2026-01-04-action-06.mp4"
target_sr = 16000
window_sec = 0.5
step_sec = 0.02
n_fft = 512
hop_length = 170
n_mels = 128

[input]
[input.input1]
name = "in_data"

[output]
[output.output1]
name = "mel"
